name: E2E
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Mỗi lúc một lượt vì cùng ghi vào một database thử.
concurrency:
  group: e2e
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Khóa chỉ cấp cho bước chạy test. Không tải kết quả lên.
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PROJECT_REF: ${{ secrets.E2E_PROJECT_REF }}
